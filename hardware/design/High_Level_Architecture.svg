<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3a68"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c5050c"/>
    </marker>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3fb"/>
      <stop offset="1" stop-color="#dce7f7"/>
    </linearGradient>
    <linearGradient id="vecGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36b"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
    <linearGradient id="projGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc299"/>
      <stop offset="1" stop-color="#ff8a50"/>
    </linearGradient>
    <linearGradient id="amGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfd9ff"/>
      <stop offset="1" stop-color="#6aa3ff"/>
    </linearGradient>
    <linearGradient id="sortGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9b6ff"/>
      <stop offset="1" stop-color="#8b6bdc"/>
    </linearGradient>
    <linearGradient id="outGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bde5c9"/>
      <stop offset="1" stop-color="#5cb377"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Title -->
  <rect x="0" y="0" width="1400" height="56" fill="#c5050c"/>
  <text x="30" y="36" font-size="24" font-weight="700" fill="#fff">Hardware Accelerator for Reformer LSH Attention — High-Level Architecture</text>
  <text x="1370" y="36" font-size="14" fill="#fff" text-anchor="end">ECE/CS 755 SP26 · Cool Team · DR2</text>

  <!-- Off-chip region (left) -->
  <g filter="url(#soft)">
    <rect x="30" y="95" width="300" height="620" rx="14" fill="#fff7e6" stroke="#e0a23a" stroke-dasharray="6 4" stroke-width="1.6"/>
  </g>
  <text x="180" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#8a5a00">Off-chip (Host / RP2040)</text>
  <text x="180" y="140" text-anchor="middle" font-size="12" fill="#6b4500">stores input vectors, does R·X multiplication, streams components</text>

  <!-- L input token vectors -->
  <text x="180" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#333">Input Token Vectors (L × d)</text>
  <g>
    <rect x="70"  y="200" width="38" height="130" rx="4" fill="url(#vecGrad)" stroke="#b47010"/>
    <rect x="116" y="200" width="38" height="130" rx="4" fill="url(#vecGrad)" stroke="#b47010"/>
    <rect x="162" y="200" width="38" height="130" rx="4" fill="url(#vecGrad)" stroke="#b47010"/>
    <rect x="208" y="200" width="38" height="130" rx="4" fill="url(#vecGrad)" stroke="#b47010"/>
    <rect x="254" y="200" width="38" height="130" rx="4" fill="url(#vecGrad)" stroke="#b47010"/>
    <text x="89"  y="345" text-anchor="middle" font-size="11" fill="#333">x₀</text>
    <text x="135" y="345" text-anchor="middle" font-size="11" fill="#333">x₁</text>
    <text x="181" y="345" text-anchor="middle" font-size="11" fill="#333">x₂</text>
    <text x="227" y="345" text-anchor="middle" font-size="11" fill="#333">…</text>
    <text x="273" y="345" text-anchor="middle" font-size="11" fill="#333">x_{L-1}</text>
    <text x="58"  y="265" text-anchor="middle" font-size="11" fill="#555" transform="rotate(-90 58 265)">d</text>
    <text x="180" y="365" text-anchor="middle" font-size="11" fill="#555">L tokens</text>
  </g>

  <!-- Random projection R -->
  <g>
    <rect x="120" y="410" width="120" height="70" rx="10" fill="#2e6dd8" stroke="#1f3a68"/>
    <text x="180" y="450" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">R</text>
    <text x="180" y="468" text-anchor="middle" font-size="11" fill="#e6ecff">random projection</text>
    <text x="252" y="440" font-size="11" fill="#333">b</text>
    <text x="170" y="498" font-size="11" fill="#333" text-anchor="middle">d × b (off-chip MAC)</text>
  </g>

  <!-- Host description -->
  <g>
    <rect x="55" y="560" width="250" height="135" rx="8" fill="#fff" stroke="#d8a84b"/>
    <text x="65" y="580" font-size="12" font-weight="700" fill="#333">Host (RP2040) streams:</text>
    <text x="65" y="600" font-size="11" fill="#333">• Projected vectors (L × b)</text>
    <text x="65" y="618" font-size="11" fill="#333">• Component-by-component via</text>
    <text x="78" y="634" font-size="11" fill="#333">16 data pins + 1 shared D_clk</text>
    <text x="65" y="654" font-size="11" fill="#333">• 3-bit unsigned per component</text>
    <text x="65" y="672" font-size="11" fill="#333">• Receives sorted (idx, bkt, valid)</text>
    <text x="65" y="688" font-size="11" fill="#333">  on 7 output pins</text>
  </g>

  <!-- Arrow: off-chip → chip -->
  <line x1="330" y1="400" x2="385" y2="400" stroke="#1f3a68" stroke-width="3" marker-end="url(#arr)"/>
  <text x="358" y="392" text-anchor="middle" font-size="11" fill="#1f3a68">stream</text>

  <!-- ============== ON-CHIP REGION ============== -->
  <g filter="url(#soft)">
    <rect x="385" y="95" width="790" height="620" rx="14" fill="url(#chipGrad)" stroke="#1f3a68" stroke-width="2"/>
  </g>
  <rect x="385" y="95" width="790" height="26" fill="#1f3a68"/>
  <text x="780" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Our Chip (2×1 TinyTapeout tile, sky130)</text>

  <!-- Projected vectors (input buffer at chip edge) -->
  <g>
    <text x="460" y="150" font-size="12" font-weight="700" fill="#333" text-anchor="middle">Projected vectors (L × b)</text>
    <rect x="410" y="170" width="100" height="50" rx="4" fill="url(#projGrad)" stroke="#9c4e12"/>
    <text x="460" y="200" text-anchor="middle" font-size="12" fill="#333">vec₀ [b=8]</text>
    <rect x="410" y="226" width="100" height="50" rx="4" fill="url(#projGrad)" stroke="#9c4e12"/>
    <text x="460" y="256" text-anchor="middle" font-size="12" fill="#333">vec₁</text>
    <rect x="410" y="282" width="100" height="50" rx="4" fill="url(#projGrad)" stroke="#9c4e12"/>
    <text x="460" y="312" text-anchor="middle" font-size="12" fill="#333">vec₂</text>
    <rect x="410" y="338" width="100" height="50" rx="4" fill="url(#projGrad)" stroke="#9c4e12"/>
    <text x="460" y="368" text-anchor="middle" font-size="12" fill="#333">vec₃</text>
    <rect x="410" y="394" width="100" height="50" rx="4" fill="url(#projGrad)" stroke="#9c4e12"/>
    <text x="460" y="424" text-anchor="middle" font-size="12" fill="#333">vec₄</text>
  </g>

  <!-- Shared Index Counter (control) -->
  <g>
    <rect x="410" y="480" width="210" height="55" rx="8" fill="#ffe8a8" stroke="#b38a00"/>
    <text x="515" y="502" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Shared Index Counter</text>
    <text x="515" y="520" text-anchor="middle" font-size="11" fill="#333">3-bit · driven by D_clk · feeds all 5 ArgMax</text>
  </g>

  <!-- D_clk line -->
  <g>
    <circle cx="398" cy="508" r="6" fill="#c5050c"/>
    <text x="380" y="508" text-anchor="end" font-size="11" font-weight="700" fill="#c5050c">D_clk</text>
    <line x1="398" y1="508" x2="410" y2="508" stroke="#c5050c" stroke-width="2"/>
  </g>

  <!-- ArgMax Array (Stage 1) -->
  <g>
    <rect x="585" y="155" width="220" height="305" rx="10" fill="#eaf2ff" stroke="#3a6fbf" stroke-width="1.5"/>
    <text x="695" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#1f3a68">Stage 1 — ArgMax Array</text>
    <text x="695" y="194" text-anchor="middle" font-size="11" fill="#355">5 × parallel · 3-bit datapath</text>

    <!-- 5 argmax boxes -->
    <rect x="605" y="208" width="180" height="38" rx="6" fill="url(#amGrad)" stroke="#1f3a68"/>
    <text x="695" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#0e2455">ArgMax₀  →  b₀ [2:0]</text>
    <rect x="605" y="252" width="180" height="38" rx="6" fill="url(#amGrad)" stroke="#1f3a68"/>
    <text x="695" y="276" text-anchor="middle" font-size="12" font-weight="700" fill="#0e2455">ArgMax₁  →  b₁ [2:0]</text>
    <rect x="605" y="296" width="180" height="38" rx="6" fill="url(#amGrad)" stroke="#1f3a68"/>
    <text x="695" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#0e2455">ArgMax₂  →  b₂ [2:0]</text>
    <rect x="605" y="340" width="180" height="38" rx="6" fill="url(#amGrad)" stroke="#1f3a68"/>
    <text x="695" y="364" text-anchor="middle" font-size="12" font-weight="700" fill="#0e2455">ArgMax₃  →  b₃ [2:0]</text>
    <rect x="605" y="384" width="180" height="38" rx="6" fill="url(#amGrad)" stroke="#1f3a68"/>
    <text x="695" y="408" text-anchor="middle" font-size="12" font-weight="700" fill="#0e2455">ArgMax₄  →  b₄ [2:0]</text>

    <text x="695" y="445" text-anchor="middle" font-size="10" fill="#555">registers update on D_clk when value &gt; max</text>
  </g>

  <!-- Arrows: projected vecs → ArgMax -->
  <g stroke="#1f3a68" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="510" y1="195" x2="605" y2="227"/>
    <line x1="510" y1="251" x2="605" y2="271"/>
    <line x1="510" y1="307" x2="605" y2="315"/>
    <line x1="510" y1="363" x2="605" y2="359"/>
    <line x1="510" y1="419" x2="605" y2="403"/>
  </g>
  <text x="560" y="187" font-size="10" fill="#1f3a68">3-bit value / cycle</text>

  <!-- Shared index to all argmax -->
  <path d="M620 490 C 640 490, 650 460, 603 440" stroke="#b38a00" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
  <path d="M620 490 C 640 490, 650 400, 603 384" stroke="#b38a00" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
  <path d="M620 490 C 640 490, 650 335, 603 318" stroke="#b38a00" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
  <path d="M620 490 C 640 490, 650 275, 603 270" stroke="#b38a00" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
  <path d="M620 490 C 640 490, 650 220, 603 224" stroke="#b38a00" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
  <text x="635" y="480" font-size="10" fill="#8a6a00">index[2:0]</text>

  <!-- Sorting Unit (Stage 2) -->
  <g>
    <rect x="850" y="155" width="260" height="305" rx="10" fill="#f2edff" stroke="#6b4bb8" stroke-width="1.5"/>
    <text x="980" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#3a2078">Stage 2 — Sorting Unit</text>
    <text x="980" y="194" text-anchor="middle" font-size="11" fill="#4b2b8a">counting sort · value-level parallelism</text>

    <!-- Buffers -->
    <g>
      <text x="870" y="218" font-size="11" font-weight="700" fill="#3a2078">Buffers (B_i)</text>
      <rect x="865" y="226" width="34" height="24" rx="4" fill="url(#sortGrad)" stroke="#3a2078"/>
      <text x="882" y="243" text-anchor="middle" font-size="11" fill="#fff">I₀</text>
      <rect x="865" y="254" width="34" height="24" rx="4" fill="url(#sortGrad)" stroke="#3a2078"/>
      <text x="882" y="271" text-anchor="middle" font-size="11" fill="#fff">I₁</text>
      <rect x="865" y="282" width="34" height="24" rx="4" fill="url(#sortGrad)" stroke="#3a2078"/>
      <text x="882" y="299" text-anchor="middle" font-size="11" fill="#fff">I₂</text>
      <rect x="865" y="310" width="34" height="24" rx="4" fill="url(#sortGrad)" stroke="#3a2078"/>
      <text x="882" y="327" text-anchor="middle" font-size="11" fill="#fff">I₃</text>
      <rect x="865" y="338" width="34" height="24" rx="4" fill="url(#sortGrad)" stroke="#3a2078"/>
      <text x="882" y="355" text-anchor="middle" font-size="11" fill="#fff">I₄</text>
    </g>

    <!-- Comparators -->
    <g>
      <rect x="915" y="226" width="40" height="24" rx="4" fill="#b6e5b6" stroke="#2a6f2a"/>
      <text x="935" y="243" text-anchor="middle" font-size="12" font-weight="700" fill="#123">=</text>
      <rect x="915" y="254" width="40" height="24" rx="4" fill="#b6e5b6" stroke="#2a6f2a"/>
      <text x="935" y="271" text-anchor="middle" font-size="12" font-weight="700" fill="#123">=</text>
      <rect x="915" y="282" width="40" height="24" rx="4" fill="#b6e5b6" stroke="#2a6f2a"/>
      <text x="935" y="299" text-anchor="middle" font-size="12" font-weight="700" fill="#123">=</text>
      <rect x="915" y="310" width="40" height="24" rx="4" fill="#b6e5b6" stroke="#2a6f2a"/>
      <text x="935" y="327" text-anchor="middle" font-size="12" font-weight="700" fill="#123">=</text>
      <rect x="915" y="338" width="40" height="24" rx="4" fill="#b6e5b6" stroke="#2a6f2a"/>
      <text x="935" y="355" text-anchor="middle" font-size="12" font-weight="700" fill="#123">=</text>
    </g>

    <!-- Bucket counter -->
    <rect x="865" y="380" width="90" height="34" rx="6" fill="#ffe8a8" stroke="#b38a00"/>
    <text x="910" y="401" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Bucket cnt</text>

    <!-- Priority encoder & control -->
    <rect x="975" y="230" width="115" height="160" rx="8" fill="#4b2b8a" stroke="#2a1550"/>
    <text x="1032" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Priority</text>
    <text x="1032" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Encoder</text>
    <text x="1032" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">&amp; Ctrl FSM</text>

    <!-- Lines buffers -> comparators -> encoder -->
    <g stroke="#3a2078" stroke-width="1.2" fill="none">
      <line x1="899" y1="238" x2="915" y2="238"/>
      <line x1="899" y1="266" x2="915" y2="266"/>
      <line x1="899" y1="294" x2="915" y2="294"/>
      <line x1="899" y1="322" x2="915" y2="322"/>
      <line x1="899" y1="350" x2="915" y2="350"/>
      <line x1="955" y1="238" x2="975" y2="260" marker-end="url(#arr)"/>
      <line x1="955" y1="266" x2="975" y2="275" marker-end="url(#arr)"/>
      <line x1="955" y1="294" x2="975" y2="295" marker-end="url(#arr)"/>
      <line x1="955" y1="322" x2="975" y2="315" marker-end="url(#arr)"/>
      <line x1="955" y1="350" x2="975" y2="335" marker-end="url(#arr)"/>
      <!-- bucket cnt -> comparators (broadcast) -->
      <path d="M910 380 C 910 370, 935 372, 935 362" stroke-dasharray="3 2"/>
      <path d="M910 380 C 908 370, 935 345, 935 335" stroke-dasharray="3 2"/>
      <path d="M910 380 C 905 370, 935 320, 935 307" stroke-dasharray="3 2"/>
      <path d="M910 380 C 900 365, 935 295, 935 279" stroke-dasharray="3 2"/>
      <path d="M910 380 C 900 360, 935 270, 935 251" stroke-dasharray="3 2"/>
      <!-- inc feedback -->
      <path d="M1032 390 C 1032 410, 955 410, 955 400" marker-end="url(#arr)"/>
    </g>
    <text x="1000" y="415" font-size="10" fill="#3a2078">Inc_cnt (no match)</text>
  </g>

  <!-- Arrows: ArgMax array → Sorting -->
  <g stroke="#1f3a68" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="786" y1="227" x2="860" y2="238"/>
    <line x1="786" y1="271" x2="860" y2="266"/>
    <line x1="786" y1="315" x2="860" y2="294"/>
    <line x1="786" y1="359" x2="860" y2="322"/>
    <line x1="786" y1="403" x2="860" y2="350"/>
  </g>
  <text x="820" y="210" font-size="11" fill="#1f3a68">b_i[2:0] × 5</text>

  <!-- Output stream -->
  <g>
    <rect x="850" y="495" width="260" height="95" rx="10" fill="#e8f5ea" stroke="#2a6f2a"/>
    <text x="980" y="518" text-anchor="middle" font-size="13" font-weight="700" fill="#1c4a1c">Sorted Output Stream</text>
    <rect x="870" y="528" width="70" height="42" rx="6" fill="url(#outGrad)" stroke="#1c4a1c"/>
    <text x="905" y="554" text-anchor="middle" font-size="12" font-weight="700">index</text>
    <rect x="950" y="528" width="70" height="42" rx="6" fill="url(#outGrad)" stroke="#1c4a1c"/>
    <text x="985" y="554" text-anchor="middle" font-size="12" font-weight="700">bucket</text>
    <rect x="1030" y="528" width="60" height="42" rx="6" fill="url(#outGrad)" stroke="#1c4a1c"/>
    <text x="1060" y="554" text-anchor="middle" font-size="12" font-weight="700">valid</text>
    <text x="980" y="584" text-anchor="middle" font-size="10" fill="#1c4a1c">3 + 3 + 1 bits · ascending bucket order</text>
  </g>
  <line x1="1032" y1="390" x2="1032" y2="495" stroke="#2a6f2a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- I/O pins labels -->
  <g>
    <rect x="410" y="620" width="220" height="80" rx="8" fill="#fff" stroke="#555"/>
    <text x="520" y="640" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Pins (2×1 TT tile)</text>
    <text x="420" y="658" font-size="11" fill="#333">ui_in[7:0] + uio[7:0]: 15 data + 1 D_clk</text>
    <text x="420" y="674" font-size="11" fill="#333">uo_out[7:0]: {valid, bucket[2:0], index[2:0]}</text>
    <text x="420" y="690" font-size="11" fill="#333">No SRAM / SPI · direct streaming</text>
  </g>

  <!-- Parameter legend -->
  <g>
    <rect x="650" y="620" width="230" height="80" rx="8" fill="#fff" stroke="#555"/>
    <text x="765" y="640" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Parameters (current)</text>
    <text x="660" y="658" font-size="11" fill="#333">L = 5 vectors · b = 8 buckets · 3-bit</text>
    <text x="660" y="674" font-size="11" fill="#333">ArgMax phase: B = 8 D_clk cycles</text>
    <text x="660" y="690" font-size="11" fill="#333">Sort phase: ≤ L + B = 13 sys-clk cycles</text>
  </g>

  <!-- Downstream (attention) note -->
  <g>
    <rect x="1205" y="95" width="170" height="620" rx="14" fill="#eaf6ee" stroke="#2a6f2a" stroke-dasharray="6 4" stroke-width="1.6"/>
    <text x="1290" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#1c4a1c">Downstream (host)</text>
    <text x="1290" y="150" text-anchor="middle" font-size="12" fill="#1c4a1c">Uses sorted stream to</text>
    <text x="1290" y="167" text-anchor="middle" font-size="12" fill="#1c4a1c">compute chunked QK^T</text>
    <text x="1290" y="184" text-anchor="middle" font-size="12" fill="#1c4a1c">attention per bucket</text>
    <rect x="1230" y="220" width="40" height="70" rx="4" fill="url(#outGrad)" stroke="#1c4a1c"/>
    <rect x="1280" y="220" width="40" height="70" rx="4" fill="url(#outGrad)" stroke="#1c4a1c"/>
    <rect x="1330" y="220" width="40" height="70" rx="4" fill="url(#outGrad)" stroke="#1c4a1c"/>
    <text x="1250" y="262" text-anchor="middle" font-size="14" font-weight="700">2</text>
    <text x="1300" y="262" text-anchor="middle" font-size="14" font-weight="700">4</text>
    <text x="1350" y="262" text-anchor="middle" font-size="14" font-weight="700">7</text>
    <path d="M1250 292 C 1260 330, 1340 330, 1350 292" stroke="#1c4a1c" fill="none" marker-end="url(#arrRed)" stroke-width="1.5"/>
    <text x="1290" y="348" text-anchor="middle" font-size="11" fill="#1c4a1c">attention within bucket</text>
    <text x="1290" y="380" text-anchor="middle" font-size="11" fill="#333">Softmax(QK^T / √d) · V</text>
    <text x="1290" y="410" text-anchor="middle" font-size="11" fill="#333">un-sort to original order</text>
    <text x="1290" y="680" text-anchor="middle" font-size="10" fill="#888">(not on our chip)</text>
  </g>
  <line x1="1110" y1="540" x2="1205" y2="400" stroke="#2a6f2a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Flow legend bottom strip -->
  <g>
    <rect x="30" y="735" width="1340" height="35" rx="6" fill="#f3f3f3" stroke="#bbb"/>
    <text x="50" y="758" font-size="12" fill="#333"><tspan font-weight="700">Data flow:</tspan>  off-chip X·R  →  projected vectors  →  5× ArgMax (bucket IDs)  →  Counting-sort  →  (index, bucket, valid) stream  →  host attention</text>
  </g>
</svg>
